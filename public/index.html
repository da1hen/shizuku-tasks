<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eff5ff">
  <title>しずく — タスク</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <div class="shell">
    <header class="top">
      <div class="brand"><span class="brand-icon" data-icon="drop"></span>しずく</div>
      <button class="account glass" id="account" type="button"><span data-icon="user"></span><span id="account-label">ログイン</span></button>
    </header>
    <main>
      <div class="heading">
        <time id="today"></time>
        <h1>タスク</h1>
      </div>
      <form class="composer glass" id="composer">
        <label for="memo"><span data-icon="pen"></span>クイックメモ</label>
        <textarea id="memo" rows="2" maxlength="600" placeholder="思いついたことを書く…" autofocus></textarea>
        <div class="composer-actions">
          <button class="ai" id="ai" type="button"><span data-icon="spark"></span>AIで分ける</button>
          <button class="primary" type="submit"><span data-icon="plus"></span>追加</button>
        </div>
      </form>
      <dialog id="account-dialog" class="glass">
        <div class="dialog-heading"><h2 id="account-title">ログイン</h2><button class="icon-button" data-close="account-dialog" aria-label="閉じる"><span data-icon="close"></span></button></div>
        <p id="account-description"></p>
        <a id="google" class="primary google" href="/auth/google">Googleでログイン</a>
        <button id="import" class="secondary" type="button" hidden>この端末のタスクを取り込む</button>
        <button id="logout" class="secondary" type="button" hidden>ログアウト</button>
      </dialog>
      <dialog id="edit-dialog" class="glass">
        <div class="dialog-heading"><h2 id="edit-title">タスクを編集</h2><button class="icon-button" data-close="edit-dialog" aria-label="閉じる"><span data-icon="close"></span></button></div>
        <form id="edit-form">
          <label for="edit-memo">タスク名</label>
          <textarea id="edit-memo" rows="3" maxlength="600" required autofocus></textarea>
          <label for="edit-status">ステータス</label>
          <select id="edit-status"><option value="todo">未着手</option><option value="doing">進行中</option><option value="done">完了</option></select>
          <div class="dialog-actions"><button id="delete" class="danger" type="button">削除</button><button class="primary" type="submit">保存</button></div>
        </form>
      </dialog>
      <dialog id="ai-dialog" class="glass">
        <div class="dialog-heading"><h2>AIの分割案</h2><button class="icon-button" data-close="ai-dialog" aria-label="閉じる"><span data-icon="close"></span></button></div>
        <ul id="suggestions"></ul>
        <div class="dialog-actions"><button class="secondary" data-close="ai-dialog">戻る</button><button class="primary" id="accept-ai">すべて追加</button></div>
      </dialog>
      <section class="task-section" aria-labelledby="tasks-title">
        <div class="section-heading"><h2 id="tasks-title">タスク一覧</h2><span id="completion"></span></div>
        <nav class="filters glass" aria-label="ステータスで絞り込む">
          <button data-filter="all" aria-pressed="true">すべて <span></span></button>
          <button data-filter="todo" aria-pressed="false">未着手 <span></span></button>
          <button data-filter="doing" aria-pressed="false">進行中 <span></span></button>
          <button data-filter="done" aria-pressed="false">完了 <span></span></button>
        </nav>
        <div id="tasks" aria-busy="true">
          <div class="task-skeleton glass" aria-hidden="true"><i></i><b></b></div>
          <div class="task-skeleton glass" aria-hidden="true"><i></i><b></b></div>
          <div class="task-skeleton glass" aria-hidden="true"><i></i><b></b></div>
        </div>
        <div class="gesture-guide" id="gesture-guide" hidden><span data-icon="swipe"></span>左にフリックで進める<span class="divider">／</span>右にフリックで戻す</div>
      </section>
    </main>
    <footer><span data-icon="device"></span><span id="storage-label">この端末に保存</span><span aria-hidden="true">·</span><a href="/privacy.html">プライバシー</a></footer>
  </div>
  <div id="launch" class="launch" aria-hidden="true">
    <div class="shell">
      <div class="launch-top"><i></i><i></i></div>
      <div class="launch-heading"><i></i><i></i></div>
      <div class="launch-composer"><i></i><i></i><i></i></div>
      <div class="launch-list"><i></i><i></i><i></i><i></i></div>
    </div>
  </div>
  <div id="toast" class="toast glass" role="status" hidden><span id="toast-message"></span><button id="undo" hidden>元に戻す</button></div>
</body>
</html>
